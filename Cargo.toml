[workspace]
resolver = "2"
members = [
    # Shared core modules
    "crates/wb-providers",
    "crates/wb-policy",
    "crates/wb-transcript",
    "crates/wb-skills",
    "crates/wb-sandbox",
    # Analysis workbench
    "crates/protocol",
    "crates/core",
    "crates/cli",
    "apps/desktop/src-tauri",
    # Deck workbench (to be folded into the single app)
    "present/crates/protocol",
    "present/crates/core",
    "present/crates/cli",
    "present/apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4"
sha2 = "0.10"
tempfile = "3"
regex = "1"
base64 = "0.22"
walkdir = "2"
glob = "0.3"
hex = "0.4"
bytes = "1"
ts-rs = { version = "12", features = ["serde-compat"] }
notify = "8"
ignore = "0.4"
portable-pty = "0.9"
trash = "5"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
schemars = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
rand = "0.8"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
