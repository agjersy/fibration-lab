[package]
name = "wb-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sandbox launcher: Windows AppContainer + job object; resource limits elsewhere"

[lib]
path = "src/lib.rs"

# The helper the Python kernel launches on Windows (python/kernel/present_kernel/runner/sandbox.py).
[[bin]]
name = "present-sandbox"
path = "src/bin/present-sandbox.rs"

# Test-only child used by the integration tests (file, network, and memory probes). Not shipped.
[[bin]]
name = "sandbox-probe"
path = "src/bin/sandbox-probe.rs"
test = false

[dependencies]

# MIT OR Apache-2.0. Raw Win32 bindings; no other Windows dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# MIT OR Apache-2.0. setrlimit on the non-Windows fallback path.
[target.'cfg(unix)'.dependencies]
libc = "0.2.170"

[dev-dependencies]
tempfile = "3"
