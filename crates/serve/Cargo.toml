[package]
name = "fibration-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Development bridge: serves the real core to a browser renderer over a loopback WebSocket. Never shipped."

[[bin]]
name = "fibration-serve"
path = "src/main.rs"

[lib]
name = "fibration_serve"
path = "src/lib.rs"

[dependencies]
fibration-core = { path = "../core" }
fibration-protocol = { path = "../protocol" }
tokio.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
rand.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
tempfile.workspace = true
