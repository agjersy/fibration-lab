# License policy (BUILD-SPEC rule 4): permissive only.
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD", "BSL-1.0", "CDLA-Permissive-2.0",
    "OpenSSL", "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
