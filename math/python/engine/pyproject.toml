[project]
name = "fibration-math-engine"
version = "0.0.1"
description = "Fibration Math's math engine: SymPy behind a per-function call API with opaque handles"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
fibration-math-engine = "fibration_math_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "fibration-math"]

[tool.uv.sources]
fibration-math = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fibration_math_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "RUF012", "SIM108", "B905", "RUF001", "RUF002", "RUF003"]
