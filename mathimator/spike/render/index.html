<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathimator render spike</title>
<style>
  :root { color-scheme: light; --bg: #fbfbfa; --fg: #1d1f23; --muted: #6b7078; --panel: rgba(255,255,255,.92); --line: #d9dbde; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel { position: fixed; top: 12px; left: 12px; max-width: 420px; padding: 10px 12px; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; }
  #panel h1 { font-size: 13px; margin: 0 0 4px; }
  #panel p { margin: 2px 0; color: var(--muted); }
  #panel pre { margin: 8px 0 0; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  #panel label { display: block; margin-top: 8px; }
  #panel input[type=range] { width: 100%; }
  button, a.button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
                     color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; margin: 6px 6px 0 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Mathimator render spike (WP-0.12)</h1>
  <p id="config"></p>
  <p id="gpu"></p>
  <label id="manual">Drag to move every parameter (manual check)
    <input id="slider" type="range" min="0" max="1" step="0.001" value="0.25">
  </label>
  <button id="run">Run the measurement</button>
  <a id="download" class="button hidden" download="results.json">Download results.json</a>
  <pre id="out"></pre>
</div>
<script src="scene.js"></script>
<script>
'use strict';
// A WebGL2 plot renderer for the preview path of ARCHITECTURE 9.1, and a frame-time measurement.
//
// Query parameters:
//   curves=20      number of explicit curves (the 20 generated ones, repeated with shifted parameters)
//   samples=2048   samples per curve (two vertices each)
//   implicit=1     draw the implicit curve and the region in a full-screen fragment shader
//   frames=600     measured frames (after 30 warm-up frames)
//   auto=1         start the measurement on load
//   panel=0        hide the panel (for screenshots)

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? Number(Q.get(k)) : d);
const CONFIG = {
  curves: num('curves', 20), samples: num('samples', 2048), implicit: num('implicit', 1) === 1,
  frames: num('frames', 600), auto: num('auto', 0) === 1,
};
const WARMUP = 30;
const VIEW = [-10, 10, -6.25, 6.25];   // xlo, xhi, ylo, yhi (16:10)
const SCENE = window.SPIKE_SCENE;

const canvas = document.getElementById('c');
const out = document.getElementById('out');
if (num('panel', 1) === 0) document.getElementById('panel').classList.add('hidden');

const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { out.textContent = 'WebGL2 is not available in this webview.'; throw new Error('no WebGL2'); }

const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const GPU = {
  renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
  vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
  version: gl.getParameter(gl.VERSION),
  glsl: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
};
document.getElementById('gpu').textContent = GPU.renderer;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
  return s;
}
function link(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const decls = (uniforms) => uniforms.map((u) => `uniform float ${u.name};\n`).join('');

// ---- explicit curves: y = f(x) evaluated in the vertex shader -----------------------------
// No vertex buffers: vertex 2k and 2k+1 are the two sides of the ribbon at sample k, so a drag
// only changes uniforms. The ribbon is `u_half` pixels to each side of the curve plus one
// pixel of anti-aliasing. A vertex is marked bad where f is undefined or where the curve jumps
// across the whole view between neighbouring samples (a pole); triangles touching a bad vertex
// are discarded, so no line is drawn across an asymptote.
function curveProgram(curve) {
  const vs = `#version 300 es
precision highp float;
${decls(curve.uniforms)}${SCENE.prelude}${curve.glsl}
uniform vec4 u_view;
uniform vec2 u_size;
uniform int u_n;
uniform float u_half;
out float v_side;
out float v_bad;
bool ok(float y) { return !(isnan(y) || isinf(y)); }
float clipY(float y) { return (y - u_view.z) / (u_view.w - u_view.z) * 2.0 - 1.0; }
bool jump(float ya, float yb) {
  float a = clipY(ya), b = clipY(yb);
  return (a > 1.5 && b < -1.5) || (a < -1.5 && b > 1.5);
}
vec2 toPx(float x, float y) {
  float reach = 1.0e4 * (u_view.w - u_view.z);
  y = clamp(y, u_view.z - reach, u_view.w + reach);
  return vec2((x - u_view.x) / (u_view.y - u_view.x), (y - u_view.z) / (u_view.w - u_view.z)) * u_size;
}
void main() {
  int k = gl_VertexID >> 1;
  float side = float(gl_VertexID & 1) * 2.0 - 1.0;
  float dx = (u_view.y - u_view.x) / float(u_n - 1);
  float x = u_view.x + float(k) * dx;
  float y0 = f(x - dx), y1 = f(x), y2 = f(x + dx);
  bool bad = !ok(y1);
  if (!bad && ok(y0) && jump(y0, y1)) bad = true;
  if (!bad && ok(y2) && jump(y1, y2)) bad = true;
  if (bad) { y1 = 0.0; y0 = 0.0; y2 = 0.0; }
  vec2 p = toPx(x, y1);
  vec2 a = ok(y0) ? toPx(x - dx, y0) : p;
  vec2 b = ok(y2) ? toPx(x + dx, y2) : p;
  vec2 t = b - a;
  float len = length(t);
  t = len > 0.0 ? t / len : vec2(1.0, 0.0);
  float w = u_half + 1.0;
  p += vec2(-t.y, t.x) * side * w;
  v_side = side * w;
  v_bad = bad ? 1.0 : 0.0;
  gl_Position = vec4(p / u_size * 2.0 - 1.0, 0.0, 1.0);
}`;
  const fs = `#version 300 es
precision highp float;
uniform vec4 u_color;
uniform float u_half;
in float v_side;
in float v_bad;
out vec4 o;
void main() {
  if (v_bad > 0.0) discard;
  float a = clamp(u_half + 0.5 - abs(v_side), 0.0, 1.0);
  o = vec4(u_color.rgb, u_color.a * a);
}`;
  const p = link(vs, fs);
  return {
    p,
    view: gl.getUniformLocation(p, 'u_view'), size: gl.getUniformLocation(p, 'u_size'),
    n: gl.getUniformLocation(p, 'u_n'), half: gl.getUniformLocation(p, 'u_half'),
    color: gl.getUniformLocation(p, 'u_color'),
    params: curve.uniforms.map((u) => ({ ...u, loc: gl.getUniformLocation(p, u.name) })),
  };
}

// ---- implicit curve and region: evaluated per pixel in the fragment shader -----------------
// The curve F = 0 is drawn where |F| / |grad F| is under a pixel, with the gradient from
// screen-space derivatives; the region is a translucent fill where inside() is true.
function fieldProgram(implicit, region) {
  const uniforms = [...implicit.uniforms, ...region.uniforms];
  const vs = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
  const fs = `#version 300 es
precision highp float;
${decls(uniforms)}${SCENE.prelude}${implicit.glsl}
${region.glsl}
uniform vec4 u_view;
uniform vec2 u_size;
out vec4 o;
void main() {
  vec2 xy = vec2(mix(u_view.x, u_view.y, gl_FragCoord.x / u_size.x), mix(u_view.z, u_view.w, gl_FragCoord.y / u_size.y));
  float v = F(xy);
  float d = abs(v) / max(length(vec2(dFdx(v), dFdy(v))), 1.0e-20);
  float line = clamp(1.6 - d, 0.0, 1.0);
  float fill = inside(xy) ? 0.16 : 0.0;
  vec3 lineColor = vec3(0.55, 0.20, 0.60);
  vec3 fillColor = vec3(0.15, 0.50, 0.75);
  float a = line + fill * (1.0 - line);
  if (a <= 0.0) discard;
  o = vec4((lineColor * line + fillColor * fill * (1.0 - line)) / a, a);
}`;
  const p = link(vs, fs);
  return {
    p, view: gl.getUniformLocation(p, 'u_view'), size: gl.getUniformLocation(p, 'u_size'),
    params: uniforms.map((u) => ({ ...u, loc: gl.getUniformLocation(p, u.name) })),
  };
}

// ---- grid and axes: a static vertex buffer of thin quads -----------------------------------
function gridProgram() {
  const vs = `#version 300 es
in vec2 a_pos;
in vec4 a_color;
out vec4 v_color;
void main() { v_color = a_color; gl_Position = vec4(a_pos, 0.0, 1.0); }`;
  const fs = `#version 300 es
precision highp float;
in vec4 v_color;
out vec4 o;
void main() { o = v_color; }`;
  const p = link(vs, fs);
  const data = [];
  const quad = (x0, y0, x1, y1, c) => {
    for (const [x, y] of [[x0, y0], [x1, y0], [x1, y1], [x0, y0], [x1, y1], [x0, y1]]) data.push(x, y, ...c);
  };
  const cx = (x) => (x - VIEW[0]) / (VIEW[1] - VIEW[0]) * 2 - 1;
  const cy = (y) => (y - VIEW[2]) / (VIEW[3] - VIEW[2]) * 2 - 1;
  const hw = 1 / canvas.width, hh = 1 / canvas.height;   // half a pixel-pair in clip units
  for (let x = Math.ceil(VIEW[0]); x <= VIEW[1]; x++) {
    const c = x === 0 ? [0.25, 0.27, 0.30, 1] : [0.86, 0.87, 0.88, 1];
    quad(cx(x) - hw, -1, cx(x) + hw, 1, c);
  }
  for (let y = Math.ceil(VIEW[2]); y <= VIEW[3]; y++) {
    const c = y === 0 ? [0.25, 0.27, 0.30, 1] : [0.86, 0.87, 0.88, 1];
    quad(-1, cy(y) - hh, 1, cy(y) + hh, c);
  }
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(p, 'a_pos'), col = gl.getAttribLocation(p, 'a_color');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(col);
  gl.vertexAttribPointer(col, 4, gl.FLOAT, false, 24, 8);
  gl.bindVertexArray(null);
  return { p, vao, count: data.length / 6 };
}

// ---- scene setup ----------------------------------------------------------------------------
const tCompile = performance.now();
const programs = SCENE.curves.map(curveProgram);
const field = CONFIG.implicit ? fieldProgram(SCENE.implicit, SCENE.region) : null;
const grid = gridProgram();
const emptyVao = gl.createVertexArray();   // attribute-less draws still need a bound VAO
gl.finish();
const compileMs = performance.now() - tCompile;

// Curve instance i uses program i mod 20 with its own phase, so 100 curves are 100 draw calls.
const instances = [];
for (let i = 0; i < CONFIG.curves; i++) {
  const hue = (i * 137.508) % 360;
  instances.push({ prog: programs[i % programs.length], phase: i * 0.61803, color: hsl(hue, 0.62, 0.42) });
}
function hsl(h, s, l) {
  const f = (n) => { const k = (n + h / 30) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4), 1];
}

gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0.984, 0.984, 0.980, 1);

// The simulated drag: every parameter sweeps 90% of its slider range, each with its own phase.
function paramValue(u, s, phase) {
  const mid = (u.min + u.max) / 2, amp = 0.45 * (u.max - u.min);
  return mid + amp * Math.sin(2 * Math.PI * s + phase);
}

let drawCalls = 0, vertices = 0;
function draw(s) {
  drawCalls = 0; vertices = 0;
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(grid.p);
  gl.bindVertexArray(grid.vao);
  gl.drawArrays(gl.TRIANGLES, 0, grid.count);
  drawCalls++; vertices += grid.count;

  gl.bindVertexArray(emptyVao);
  if (field) {
    gl.useProgram(field.p);
    gl.uniform4fv(field.view, VIEW);
    gl.uniform2f(field.size, canvas.width, canvas.height);
    for (const u of field.params) gl.uniform1f(u.loc, paramValue(u, s, 0.4));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    drawCalls++; vertices += 3;
  }
  const half = 0.9 * (window.devicePixelRatio || 1);
  for (const inst of instances) {
    const g = inst.prog;
    gl.useProgram(g.p);
    gl.uniform4fv(g.view, VIEW);
    gl.uniform2f(g.size, canvas.width, canvas.height);
    gl.uniform1i(g.n, CONFIG.samples);
    gl.uniform1f(g.half, half);
    gl.uniform4fv(g.color, inst.color);
    for (const u of g.params) gl.uniform1f(u.loc, paramValue(u, s, inst.phase));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 2 * CONFIG.samples);
    drawCalls++; vertices += 2 * CONFIG.samples;
  }
}

// ---- measurement ------------------------------------------------------------------------------
// Each frame: set the uniforms, draw, then force the GPU to finish (gl.finish and a one-pixel
// readPixels, which cannot return before the frame is rendered). `draw` is that whole span;
// `interval` is the time between animation frames, which shows whether the display rate held.
const pixel = new Uint8Array(4);
function stats(a) {
  const s = Float64Array.from(a).sort();
  const q = (p) => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  const r = (v) => Math.round(v * 100) / 100;
  return { median: r(q(0.5)), p95: r(q(0.95)), p99: r(q(0.99)), max: r(s[s.length - 1]), mean: r(s.reduce((x, y) => x + y, 0) / s.length) };
}

function measure() {
  return new Promise((resolve) => {
    const drawMs = [], intervalMs = [];
    let frame = 0, last = null;
    const total = WARMUP + CONFIG.frames;
    function tick(ts) {
      const t0 = performance.now();
      draw(frame / 240);                 // one full sweep of every slider each 240 frames
      gl.finish();
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      const t1 = performance.now();
      if (frame >= WARMUP) {
        drawMs.push(t1 - t0);
        if (last !== null) intervalMs.push(ts - last);
      }
      last = ts;
      frame++;
      if (frame < total) requestAnimationFrame(tick);
      else {
        resolve({
          config: { ...CONFIG, width: canvas.width, height: canvas.height, dpr: window.devicePixelRatio || 1, view: VIEW },
          gpu: GPU, userAgent: navigator.userAgent,
          drawMs: stats(drawMs), intervalMs: stats(intervalMs),
          framesOver16_7: drawMs.filter((v) => v > 16.7).length,
          droppedFrames: intervalMs.filter((v) => v > 25).length,
          frames: drawMs.length, drawCalls, vertices, compileMs: Math.round(compileMs * 10) / 10,
          programs: programs.length + (field ? 1 : 0) + 1,
        });
      }
    }
    requestAnimationFrame(tick);
  });
}

document.getElementById('config').textContent =
  `${CONFIG.curves} curves × ${CONFIG.samples} samples, implicit layer ${CONFIG.implicit ? 'on' : 'off'}, ` +
  `${canvas.width}×${canvas.height} px, ${CONFIG.frames} frames`;

async function run() {
  out.textContent = 'measuring…';
  const result = await measure();
  window.__spikeResults = result;
  out.textContent =
    `draw+finish  median ${result.drawMs.median} ms  p95 ${result.drawMs.p95}  p99 ${result.drawMs.p99}  max ${result.drawMs.max}\n` +
    `frame gap    median ${result.intervalMs.median} ms  p95 ${result.intervalMs.p95}  max ${result.intervalMs.max}\n` +
    `over 16.7 ms: ${result.framesOver16_7} of ${result.frames}   dropped: ${result.droppedFrames}\n` +
    `${result.drawCalls} draw calls, ${result.vertices} vertices, shaders compiled in ${result.compileMs} ms`;
  const link = document.getElementById('download');
  link.href = URL.createObjectURL(new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' }));
  link.classList.remove('hidden');
  return result;
}

const slider = document.getElementById('slider');
slider.addEventListener('input', () => draw(Number(slider.value)));
document.getElementById('run').addEventListener('click', run);
draw(Number(slider.value));
if (CONFIG.auto) run();
</script>
</body>
</html>
