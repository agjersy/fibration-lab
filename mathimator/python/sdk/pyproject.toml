[project]
name = "mathimator"
version = "0.0.1"
description = "The Mathimator scene SDK: a standard-library-only client of the Mathimator engine"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mathimator-engine"]

[tool.uv.sources]
mathimator-engine = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathimator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "RUF012", "SIM108", "B905", "RUF001", "RUF002", "RUF003"]
