[project]
name = "present-kernel"
version = "0.0.1"
description = "Deck kernel for Personal Present: templates, rendering, checks, references, sandboxed builds"
requires-python = ">=3.12"
dependencies = [
    "present-sdk",
    "python-pptx>=1.0.2",
    "lxml>=5",
    "Pillow>=10",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdfium2>=4.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jsonschema>=4.21",
    "uharfbuzz>=0.39",
    "olefile>=0.47",
    "beautifulsoup4>=4.12",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "zstandard>=0.22",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
present-kernel = "present_kernel.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4"]

[tool.uv.sources]
present-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["present_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "RUF012", "SIM108", "B905", "RUF001", "RUF002", "RUF003"]
