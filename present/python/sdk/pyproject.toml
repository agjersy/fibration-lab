[project]
name = "present-sdk"
version = "0.0.1"
description = "Deck SDK for Personal Present: template-aware python-pptx layer used by the renderer, build scripts, and generated slides"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=5",
    "Pillow>=10",
    "uharfbuzz>=0.39",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["present_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "RUF012", "SIM108", "B905", "RUF001", "RUF002", "RUF003"]
